<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Git</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: linear-gradient(to right, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 400px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        h1{
            color: #1e3c72;
            margin-bottom: 15px;
            font-size: 36px;
        }

        p{
            color: #555;
            font-size: 18px;
            margin-bottom: 25px;
        }

        button{
            background-color: #15b300;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover{
            background-color: #91197b;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <footer>
    <p>Email: praktikum@gmail.com</p></footer>

    <div class="container">
        <h1>Hello world</h1>
        <p>Ini tugas praktikum Git.</p>

        <button>Klik Say</button>
    </div>

</body>
</html>
